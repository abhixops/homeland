# ─────────────────────────────────────────────────────────────────────
#  Homeland CI — lint → test → build
#  Runs on every pull request targeting main or master.
#  Go version is pinned via go.mod so it never drifts.
# ─────────────────────────────────────────────────────────────────────

name: CI

on:
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ── 1. Lint ──────────────────────────────────────────────────────
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v6
        with:
          version: v1.64 # Pin to a specific version known to support Go 1.25 or use a more recent commit/tag

  # ── 2. Test ──────────────────────────────────────────────────────
  test:
    name: Test
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Run tests with race detector
        run: go test -race ./... -v -timeout 120s

  # ── 3. Build ─────────────────────────────────────────────────────
  build:
    name: Build
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Build Go binary
        run: |
          CGO_ENABLED=0 go build \
            -ldflags="-s -w" \
            -o bin/homeland \
            ./cmd/homeland/

      - name: Upload binary artifact
        uses: actions/upload-artifact@v4
        with:
          name: homeland-linux-amd64
          path: bin/homeland
          retention-days: 7
