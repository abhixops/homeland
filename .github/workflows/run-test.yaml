name: CI

on:
  pull_request:
    branches:
      - master
    paths-ignore:
      - "**.md"
      - "logo.png"
      - ".gitignore"
      - "configs/**"

  # Allow manual trigger from the Actions tab
  workflow_dispatch:

concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:

  # 1. Lint — fast checks that don't need a full build

  lint:
    name: Lint
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          args: --timeout=5m


  # 2. Test — build CSS, then run the full test suite

  test:
    name: Test (Go ${{ matrix.go-version }} / ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15

    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        go-version: ["1.25"]   # pin to the version in go.mod
        # Add more entries here as needed, e.g. windows-latest, macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Go
      - name: Set up Go ${{ matrix.go-version }}
        uses: actions/setup-go@v5
        with:
          go-version: ${{ matrix.go-version }}
          cache: true

      # Node / Tailwind
      # The Go binary embeds templates that reference tailwind.css at runtime,
      # so the file must exist before `go test` is invoked.
      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      # Go dependencies
      - name: Download Go modules
        run: go mod download

      - name: Verify Go modules
        run: go mod verify

      # Tests
      - name: Run tests (with race detector + coverage)
        run: |
          go test \
            -race \
            -count=1 \
            -timeout=120s \
            -coverprofile=coverage.out \
            -covermode=atomic \
            ./...

      - name: Show coverage summary
        run: go tool cover -func=coverage.out

      # Upload coverage artifact
      - name: Upload coverage report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-${{ matrix.os }}-go${{ matrix.go-version }}
          path: coverage.out
          retention-days: 7


  # 3. Build — verify the binary and Docker image compile cleanly

  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: [lint, test]   # only runs when lint + test pass

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install npm dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npm run build:css

      - name: Build Go binary (linux/amd64)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: |
          go build \
            -ldflags="-s -w" \
            -o bin/homeland \
            ./cmd/homeland/

      - name: Verify binary exists
        run: |
          ls -lh bin/homeland
          file bin/homeland

      # Validate the Dockerfile builds without errors (no push)
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          tags: homeland:pr-${{ github.event.pull_request.number }}
          cache-from: type=gha
          cache-to: type=gha,mode=max


  # 4. Status gate — single required check for branch protection rules

  ci-pass:
    name: CI Pass
    runs-on: ubuntu-latest
    needs: [lint, test, build]
    if: always()

    steps:
      - name: Check all jobs passed
        run: |
          if [[ "${{ needs.lint.result }}"  != "success" || \
                "${{ needs.test.result }}"  != "success" || \
                "${{ needs.build.result }}" != "success" ]]; then
            echo "One or more CI jobs failed."
            exit 1
          fi
          echo "All CI jobs passed ✅"