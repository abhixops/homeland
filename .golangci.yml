version: "2"

run:
  timeout: 5m

linters:
  enable:
    - errcheck
    - govet
    - staticcheck
    - unused
    - gosimple
    - ineffassign
    - shadow
    - gofmt
    - goimports

linters-settings:
  govet:
    enable-all: true

issues:
  exclusions:
    # Exclude test files from errcheck
    - linters:
        - errcheck
      path: _test\.go$
      text: "Error return value"