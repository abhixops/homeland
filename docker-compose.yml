version: "3.8"

services:
  homeland:
    image: ghcr.io/abhixops/homeland:latest
    container_name: homeland
    restart: unless-stopped
    ports:
      - "3000:3000"

    volumes:
      # Mount entire config directory
      - ./configs:/app/configs:ro
      # Docker socket for container metrics
      - /var/run/docker.sock:/var/run/docker.sock:ro
      # Icons
      - ./homeland-icons:/app/web/static/icons
      # Host metrics
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
    environment:
      - TZ=UTC
      - HOST_PROC=/host/proc
      - HOST_SYS=/host/sys

    # Docker socket access: set DOCKER_GID to match your host's docker group GID.
    # Find it with:  getent group docker | cut -d: -f3
    # Or:            stat -c '%g' /var/run/docker.sock
    group_add:
      - "${DOCKER_GID:-999}"