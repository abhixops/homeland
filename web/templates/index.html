{{define "index.html"}}
<!DOCTYPE html>
<html lang="en" x-data :class="$store.darkMode.on ? 'dark' : ''">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="{{.Title}} — Self-hosted homelab dashboard">
    <title>{{.Title}}</title>

    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <!-- Tailwind CSS (compiled) -->
    <link rel="stylesheet" href="/static/css/tailwind.css">
    <link rel="stylesheet" href="/static/css/app.css">

    <!-- HTMX for partial page updates -->
    <script src="https://unpkg.com/htmx.org@1.9.12" defer></script>

    <!-- Alpine.js for reactive UI -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
</head>
<body class="bg-surface-50 dark:bg-surface-950 text-surface-800 dark:text-surface-100 font-sans min-h-screen transition-colors duration-300">

    <!-- ── Top Navigation Bar ── -->
    <nav class="sticky top-0 z-50 bg-white/80 dark:bg-surface-900/80 backdrop-blur-xl border-b border-surface-200 dark:border-surface-800">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
            <div class="flex items-center justify-between h-16">
                <!-- Logo / Title -->
                <div class="flex items-center space-x-3">
                    <div class="w-8 h-8 bg-gradient-to-br from-homeland-500 to-homeland-700 rounded-lg flex items-center justify-center">
                        <svg class="w-5 h-5 text-white" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/>
                        </svg>
                    </div>
                    <h1 class="text-xl font-bold bg-gradient-to-r from-homeland-600 to-homeland-400 bg-clip-text text-transparent">
                        {{.Title}}
                    </h1>
                </div>

                <!-- Search Bar -->
                <div class="flex-1 max-w-md mx-8 hidden sm:block" x-data="{ searchOpen: false }">
                    <div class="relative">
                        <input
                            type="text"
                            id="search-input"
                            name="q"
                            placeholder="Search apps... ( / )"
                            class="w-full bg-surface-100 dark:bg-surface-800 border border-surface-200 dark:border-surface-700 rounded-xl px-4 py-2 pl-10 text-sm focus:outline-none focus:ring-2 focus:ring-homeland-500/50 focus:border-homeland-500 transition-all"
                            hx-get="/partial/search"
                            hx-trigger="keyup changed delay:200ms"
                            hx-target="#search-results"
                            autocomplete="off"
                        >
                        <svg class="absolute left-3 top-2.5 w-4 h-4 text-surface-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                        </svg>
                        <kbd class="absolute right-3 top-2 px-1.5 py-0.5 text-xs font-mono text-surface-400 bg-surface-200 dark:bg-surface-700 rounded">/</kbd>
                    </div>
                    <div id="search-results" class="absolute mt-2 w-full max-w-md z-50"></div>
                </div>

                <!-- Right controls -->
                <div class="flex items-center space-x-3">
                    <!-- Current time -->
                    <div class="hidden md:block text-sm text-surface-500 dark:text-surface-400 font-mono" x-data="clock()" x-text="time"></div>

                    <!-- Dark mode toggle -->
                    <button
                        @click="$store.darkMode.toggle()"
                        class="p-2 rounded-lg bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700 transition-colors"
                        title="Toggle dark mode"
                    >
                        <svg x-show="!$store.darkMode.on" class="w-5 h-5 text-surface-600" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M20.354 15.354A9 9 0 018.646 3.646 9.003 9.003 0 0012 21a9.003 9.003 0 008.354-5.646z"/>
                        </svg>
                        <svg x-show="$store.darkMode.on" class="w-5 h-5 text-yellow-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 3v1m0 16v1m9-9h-1M4 12H3m15.364 6.364l-.707-.707M6.343 6.343l-.707-.707m12.728 0l-.707.707M6.343 17.657l-.707.707M16 12a4 4 0 11-8 0 4 4 0 018 0z"/>
                        </svg>
                    </button>

                    <!-- Reload config -->
                    <button
                        hx-post="/api/reload"
                        hx-swap="none"
                        class="p-2 rounded-lg bg-surface-100 dark:bg-surface-800 hover:bg-surface-200 dark:hover:bg-surface-700 transition-colors"
                        title="Reload configuration"
                    >
                        <svg class="w-5 h-5 text-surface-600 dark:text-surface-400" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"/>
                        </svg>
                    </button>
                </div>
            </div>
        </div>
    </nav>

    <!-- ── Main Content ── -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-6">
        <div class="grid grid-cols-1 lg:grid-cols-4 gap-6">

            <!-- ── Left: App Grid (3/4 width) ── -->
            <div class="lg:col-span-3 space-y-6"
                 hx-get="/partial/grid"
                 hx-trigger="every 30s"
                 hx-swap="innerHTML"
                 id="app-grid-container">
                {{template "app_grid.html" .}}
            </div>

            <!-- ── Right: Sidebar Widgets (1/4 width) ── -->
            <div class="space-y-6">
                <!-- Calendar Widget -->
                <div class="bg-white dark:bg-surface-900 rounded-2xl border border-surface-200 dark:border-surface-800 p-5 shadow-sm"
                     hx-get="/partial/calendar"
                     hx-trigger="every 60s"
                     hx-swap="innerHTML"
                     id="calendar-widget">
                    {{template "calendar.html" .}}
                </div>

                <!-- Metrics Widget -->
                <div class="bg-white dark:bg-surface-900 rounded-2xl border border-surface-200 dark:border-surface-800 p-5 shadow-sm"
                     hx-get="/partial/metrics"
                     hx-trigger="every 10s"
                     hx-swap="innerHTML"
                     id="metrics-widget">
                    {{template "metrics.html" .}}
                </div>
            </div>
        </div>
    </main>

    <!-- ── Footer ── -->
    <footer class="mt-12 pb-6 text-center text-sm text-surface-400 dark:text-surface-600">
        <p>Homeland Dashboard &copy; {{.Year}} &mdash; Lightweight &amp; Self-hosted</p>
    </footer>

    <!-- App JS -->
    <script src="/static/js/app.js"></script>
</body>
</html>
{{end}}
