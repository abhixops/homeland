{{define "health_dot.html"}}
{{range $name, $health := .HealthMap}}
{{$status := printf "%s" $health.Status}}
<span id="health-{{$name}}" title="{{$name}}: {{healthTitle $health}}"
    class="status-dot {{if eq $status "up"}}status-up{{else if eq $status "down"}}status-down{{else}}status-unknown{{end}}"></span>
{{end}}
{{end}}
