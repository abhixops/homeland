{{define "search.html"}}
{{if .Results}}
<div class="overflow-hidden rounded-xl border border-surface-200 bg-white/95 p-1 shadow-2xl shadow-surface-900/10 backdrop-blur-xl dark:border-white/[0.08] dark:bg-[#1c2436]/95 dark:shadow-black/40">
    {{range .Results}}
    <a href="{{.URL}}" target="_blank" rel="noopener noreferrer"
       class="flex items-center gap-3 rounded-lg px-3 py-2 transition-colors hover:bg-surface-100 dark:hover:bg-white/[0.07]">
        <!-- App Icon -->
        <div class="h-8 w-8 shrink-0 rounded-lg bg-surface-100 p-1.5 dark:bg-white/[0.08]">
            <img src="{{index $.IconMap .Name}}" alt="{{.Name}}" class="w-full h-full object-contain" onerror="this.onerror=null;this.src='data:image/svg+xml,%3Csvg xmlns=%22http://www.w3.org/2000/svg%22 width=%2264%22 height=%2264%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%239ca3af%22 stroke-width=%221.5%22 stroke-linecap=%22round%22 stroke-linejoin=%22round%22%3E%3Crect x=%222%22 y=%223%22 width=%2220%22 height=%2214%22 rx=%222%22/%3E%3Cline x1=%228%22 y1=%2221%22 x2=%2216%22 y2=%2221%22/%3E%3Cline x1=%2212%22 y1=%2217%22 x2=%2212%22 y2=%2221%22/%3E%3C/svg%3E'">
        </div>

        <!-- App Info -->
        <div class="flex-1 min-w-0">
            <h4 class="text-sm font-medium text-surface-700 dark:text-surface-200 truncate">{{.Name}}</h4>
            {{if .Description}}
            <p class="text-xs text-surface-400 truncate">{{.Description}}</p>
            {{end}}
        </div>

        <!-- Health Status -->
        {{$health := index $.HealthMap .Name}}
        {{$status := printf "%s" $health.Status}}
        <span class="status-dot {{if eq $status "up"}}status-up{{else if eq $status "down"}}status-down{{else}}status-unknown{{end}}"
            title="{{healthTitle $health}}"></span>

        <!-- Arrow -->
        <svg class="w-4 h-4 text-surface-300 dark:text-surface-600 flex-shrink-0" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14"/>
        </svg>
    </a>
    {{end}}
</div>
{{else if .Query}}
<div class="rounded-xl border border-surface-200 bg-white/95 p-6 text-center shadow-2xl shadow-surface-900/10 backdrop-blur-xl dark:border-white/[0.08] dark:bg-[#1c2436]/95">
    <svg class="w-8 h-8 text-surface-300 dark:text-surface-600 mx-auto mb-2" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="1.5">
        <path stroke-linecap="round" stroke-linejoin="round" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
    </svg>
    <p class="text-sm text-surface-400">No apps found for &ldquo;{{.Query}}&rdquo;</p>
</div>
{{end}}
{{end}}
